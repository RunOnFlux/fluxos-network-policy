name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # A malformed document is rejected by every node on the network, so shape is the one
      # mistake worth failing a policy change over.
      - name: Validate policy documents
        run: node scripts/validate.js
